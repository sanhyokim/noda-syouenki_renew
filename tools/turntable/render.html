<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="1200" height="1200"></canvas>
<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:true,preserveDrawingBuffer:true});
const VS=`#version 300 es
in vec3 p;in vec3 n;in vec2 uv;uniform mat4 M,VP;out vec3 wn;out vec2 vuv;out vec3 wp;
void main(){vec4 w=M*vec4(p,1.);wp=w.xyz;wn=mat3(M)*n;vuv=uv;gl_Position=VP*w;}`;
const FS=`#version 300 es
precision highp float;in vec3 wn;in vec2 vuv;in vec3 wp;uniform sampler2D col,orm;uniform vec3 eye;uniform float exposure;out vec4 o;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){vec3 N=normalize(wn);vec3 V=normalize(eye-wp);
vec3 base=pow(texture(col,vuv).rgb,vec3(2.2));vec3 m=texture(orm,vuv).rgb;float ao=m.r,rough=clamp(m.g,.25,1.),met=m.b*.6;
vec3 L1=normalize(vec3(.6,.9,.7)),L2=normalize(vec3(-.8,.3,.4)),L3=normalize(vec3(0.,-.2,-1.));
vec3 c=vec3(0.);
vec3 Ls[3];Ls[0]=L1;Ls[1]=L2;Ls[2]=L3;vec3 Cs[3];Cs[0]=vec3(3.2,3.05,2.85);Cs[1]=vec3(.55,.62,.75);Cs[2]=vec3(1.6,1.75,2.0);
for(int i=0;i<3;i++){vec3 L=Ls[i];vec3 H=normalize(L+V);float nl=max(dot(N,L),0.);float nh=max(dot(N,H),0.);
float a=rough*rough;float d=a*a/(3.14159*pow(nh*nh*(a*a-1.)+1.,2.));vec3 F0=mix(vec3(.04),base,met);
vec3 F=F0+(1.-F0)*pow(1.-max(dot(H,V),0.),5.);
c+=Cs[i]*nl*((1.-met)*base/3.14159+F*d*.25);}
float hemi=.5+.5*N.y;c+=base*ao*mix(vec3(.10,.11,.13),vec3(.34,.35,.37),hemi);
float rim=pow(1.-max(dot(N,V),0.),3.);c+=rim*vec3(.25,.3,.35);
o=vec4(pow(aces(c*exposure),vec3(1./2.2)),1.);}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
function persp(f,a,n,fa){const t=1/Math.tan(f/2);return[t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0]}
function mul(a,b){const o=new Array(16).fill(0);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];return o}
function look(e,c,u){const z=norm(sub(e,c)),x=norm(cross(u,z)),y=cross(z,x);return[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]}
const sub=(a,b)=>a.map((v,i)=>v-b[i]),dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const l=Math.hypot(...a);return a.map(v=>v/l)};
function rotY(t){const c=Math.cos(t),s=Math.sin(t);return[c,0,-s,0,0,1,0,0,s,0,c,0,0,0,0,1]}
let count=0,ready;
window.load=async(url)=>{const b=await (await fetch(url)).arrayBuffer();const dv=new DataView(b);const jl=dv.getUint32(12,true);
const j=JSON.parse(new TextDecoder().decode(new Uint8Array(b,20,jl)));const bin=20+jl+8;
const bvv=i=>{const v=j.bufferViews[i];return [bin+(v.byteOffset||0),v.byteLength]};
const acc=(i,T)=>{const a=j.accessors[i];const [o,l]=bvv(a.bufferView);return new T(b,o,l/T.BYTES_PER_ELEMENT)};
const prim=j.meshes[0].primitives[0];
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
[['p',prim.attributes.POSITION,3],['n',prim.attributes.NORMAL,3],['uv',prim.attributes.TEXCOORD_0,2]].forEach(([nm,i,sz])=>{const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,acc(i,Float32Array),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,nm);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,sz,gl.FLOAT,false,0,0)});
const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);const idx=acc(prim.indices,Uint32Array);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,idx,gl.STATIC_DRAW);count=idx.length;
async function tex(ti,unit){const im=j.images[j.textures[ti].source];const [o,l]=bvv(im.bufferView);const bm=await createImageBitmap(new Blob([new Uint8Array(b,o,l)],{type:im.mimeType}),{imageOrientation:'none'});
const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bm);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR)}
await tex(1,0);await tex(0,1);gl.uniform1i(gl.getUniformLocation(pr,'col'),0);gl.uniform1i(gl.getUniformLocation(pr,'orm'),1);return count};
window.draw=(angle,elev=0.32,dist=1.9,exposure=1.0,w=1200,h=1200)=>{cv.width=w;cv.height=h;gl.viewport(0,0,w,h);gl.enable(gl.DEPTH_TEST);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
const eye=[0,Math.sin(elev)*dist,Math.cos(elev)*dist];const VP=mul(persp(0.62,w/h,0.1,20),look(eye,[0,-0.02,0],[0,1,0]));
gl.uniformMatrix4fv(gl.getUniformLocation(pr,'VP'),false,VP);gl.uniformMatrix4fv(gl.getUniformLocation(pr,'M'),false,rotY(angle));gl.uniform3fv(gl.getUniformLocation(pr,'eye'),eye);gl.uniform1f(gl.getUniformLocation(pr,'exposure'),exposure);
gl.drawElements(gl.TRIANGLES,count,gl.UNSIGNED_INT,0);gl.finish();return cv.toDataURL('image/png')};
</script></body></html>
